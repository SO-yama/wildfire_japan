<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wildfire Japan - リアルタイム火災監視</title>

  <!-- 1. 接続の最適化 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- 2. 非ブロッキングなCSS・フォントの読み込み -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap">

  <style>
    /* CSSの最適化: @importを削除 */
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{ --bg:#f5f7f9; --primary:#e85a1d; --text:#2c3e50; }
    body{font-family:'Noto Sans JP', sans-serif; background:var(--bg); color:var(--text); overflow:hidden;}
    /* ... 既存のスタイルがここに入ります ... */
  </style>

  <!-- 3. JavaScriptの非同期化（defer） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
</head>
<body>
  <div id="toast"></div>
  
  <header class="header">
    <div class="header-inner">
      <h1>Wildfire Japan <span>FIRE SENSE</span></h1>
      <div id="coord-text">Lat: 0, Lon: 0</div>
    </div>
  </header>

  <main class="main">
    <div id="map"></div>
    <!-- サイドバーやその他のUI要素がここに入ります -->
  </main>

  <script>
    /**
     * NASA APIリクエストのキャッシュラッパー
     */
    async function fetchWithCache(url) {
      const CACHE_NAME = 'firms-api-cache-v1';
      try {
        const cache = await caches.open(CACHE_NAME);
        const cachedResponse = await cache.match(url);
        if (cachedResponse) {
          const dateHeader = cachedResponse.headers.get('date');
          const age = Date.now() - new Date(dateHeader).getTime();
          if (age < 3600000) return cachedResponse; // 1時間以内のキャッシュ
        }
        const response = await fetch(url);
        if (response.ok) cache.put(url, response.clone());
        return response;
      } catch (e) {
        return fetch(url);
      }
    }

    /**
     * メインロジックの実行制御（DOMContentLoadedを待機）
     */
    document.addEventListener('DOMContentLoaded', () => {
      // 外部スクリプト(Leaflet)の読み込み完了後に実行
      
      /* --- 既存のメインロジック --- */
      let lastRows = []; let map, tileLayer, labelLayer;
      const FIRMS_KEY = '256135fddc6880125a19f6b864539dcc';

      function initMap() {
        map = L.map('map', {zoomControl: false}).setView([39.360, 141.902], 12);
        // タイルの遅延読み込みを有効化
        tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 18,
          loading: 'lazy'
        }).addTo(map);
        labelLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
          pane: 'shadowPane',
          loading: 'lazy'
        }).addTo(map);
      }

      /* ... その他の関数 (parseCSV, reloadFIRMS, plotFIRMS など) ... */

      // アプリケーションの開始
      window.addEventListener('load', () => {
        initMap();
        // 初期データ読み込み
        // reloadFIRMS(); 
      });

      // Service Workerの登録
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
